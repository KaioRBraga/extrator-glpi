services:
  extrator:
    build: .
    image: extratorglpi:latest
    container_name: extratorglpi
    restart: unless-stopped
    # Credenciais e URL do GLPI vivem so aqui -- nunca na imagem.
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      SERVER_PORT: "8443"
      TLS_CERT_FILE: /certs/server.crt
      TLS_KEY_FILE: /certs/server.key
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "/extrator", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
